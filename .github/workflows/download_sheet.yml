# Name of your workflow
name: Download Daily Sheet

# Controls when the workflow will run
on:
  # This schedule runs the workflow at 05:00 UTC every day.
  # You can customize the cron schedule.
  schedule:
    - cron: '0 5 * * *'
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "download"
  download:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Download the CSV file from the Google Sheet public URL
      - name: Download Google Sheet as CSV
        run: |
          # The -L flag follows redirects, and -o specifies the output file name.
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vR3hHPorUdCiTvs-RnMwLcSMJrpzNYGCMIAbLQEhgfB9HhnpXGZ_oOLOcQJiKf9cPBo4td9p6GrWjlV/pub?gid=1955159257&single=true&output=csv" -o "Data/Relevés PIT - csv_export.csv"
        
      # Step 3: Commit the new or updated CSV file to the repository
      - name: Commit and push if there are changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Message for the commit
          commit_message: "chore: Update daily data from Google Sheet"
          # Optional: The file pattern to watch for changes.
          file_pattern: "Data/*.csv"
          repository: .
          # Optional: The branch to push to. Defaults to the current branch.
          # branch: main
